<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space Actuary</title>
<meta name="description" content="Design a satellite, pick a rocket and orbit, and weigh budget, mass, and risk to find the best space mission. A NASA Space Apps Challenge 2026 entry for Space Mission Design Game." />
<meta property="og:title" content="Space Actuary" />
<meta property="og:description" content="Design a satellite under real spacecraft engineering limits and work out the mission's expected value." />
<meta name="theme-color" content="#0b0e2b" />
<link rel="icon" type="image/png" href="image/icons/mascot-orbit.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=99" />
<link rel="stylesheet" href="css/console.css?v=99" />
</head>
<body>
<main id="app">

  <section id="screen-home" class="screen active">
    <div class="home-layout">
      <div class="home-left">
        <div class="home-hero">
          <p class="home-eyebrow">NASA Space Apps Challenge 2026</p>
          <h1 id="app-title" class="game-title" data-i18n="app.title"></h1>
          <p class="game-title-alt" data-i18n="app.titleAlt"></p>
          <p class="home-subtitle" data-i18n="home.subtitle"></p>
          <p class="home-team" data-i18n="home.team"></p>
        </div>

        <nav class="home-menu panel">
          <div class="console-head"><span class="led"></span><span data-i18n="home.menuTitle"></span></div>
          <button id="home-campaign-btn" class="btn btn-primary"></button>
          <ol id="home-campaign-progress" class="campaign-pips"></ol>
          <button id="home-start-btn" class="btn btn-secondary"></button>
          <p id="home-start-hint" class="menu-hint hidden" data-i18n="home.startHint"></p>
          <button id="home-custom-btn" class="btn btn-secondary"></button>
          <button id="home-mp-btn" class="btn btn-secondary" data-i18n="home.multiplayer"></button>
          <div class="home-menu-row">
            <button id="home-codex-btn" class="btn btn-secondary" data-i18n="home.codex"></button>
            <button id="home-achievements-btn" class="btn btn-secondary" data-i18n="home.achievements"></button>
            <button id="home-settings-btn" class="btn btn-secondary" data-i18n="home.settings"></button>
          </div>
        </nav>
      </div>

      <!-- 主視覺：地球與軌道、發射台上的火箭（純裝飾） -->
      <div class="home-viewport" aria-hidden="true">
        <div class="viewport-scene">
          <div class="viewport-glow"></div>
          <img class="viewport-earth-img" src="image/ui/home-earth.png" alt="" />
          <div class="viewport-ground"></div>
          <div class="viewport-pad">
            <img class="viewport-rocket" src="image/rocket/rocket-medium.png" alt="" />
            <img class="viewport-launchpad" src="image/ui/launchpad.png" alt="" />
            <span class="viewport-steam s1"></span><span class="viewport-steam s2"></span><span class="viewport-steam s3"></span>
          </div>
        </div>
        <div class="viewport-status">
          <span><span class="led led-ok"></span><span data-i18n="home.statusNominal"></span></span>
          <span id="home-clock" class="console-clock"></span>
        </div>
      </div>
    </div>

    <section class="home-records">
      <h3 class="section-title" data-i18n="home.recordsTitle"></h3>
      <div id="home-records" class="record-grid"></div>
    </section>

    <footer class="home-footer" data-i18n="home.credits"></footer>
  </section>

  <section id="screen-custom" class="screen">
    <h2 data-i18n="custom.title"></h2>
    <p class="section-hint" data-i18n="custom.hint"></p>
    <h3 class="section-title" data-i18n="custom.objective"></h3>
    <div id="custom-objectives" class="cards custom-cards"></div>
    <h3 class="section-title" data-i18n="custom.event"></h3>
    <div id="custom-events" class="cards custom-cards"></div>
    <div class="button-row">
      <button id="custom-back-btn" class="btn btn-secondary" data-i18n="nav.back"></button>
      <button id="custom-start-btn" class="btn btn-primary" data-i18n="custom.start"></button>
    </div>
  </section>

  <section id="screen-event" class="screen">
    <ol class="mission-steps" data-current="1">
      <li data-i18n="steps.briefing"></li><li data-i18n="steps.design"></li><li data-i18n="steps.launch"></li><li data-i18n="steps.report"></li>
    </ol>
    <div class="mission-hud"></div>
    <h2 data-i18n="event.title"></h2>

    <div id="event-objectives" class="learning-objectives panel hidden"></div>

    <div id="objective-card" class="event-card panel hidden">
      <img id="objective-icon" class="event-icon" alt="" />
      <div class="event-card-body">
        <span class="chip" data-i18n="event.objectiveTag"></span>
        <h3 id="objective-name"></h3>
        <p id="objective-desc"></p>
        <p id="objective-req" class="objective-req"></p>
      </div>
    </div>

    <div id="event-reveal-card" class="event-card panel hidden">
      <img id="event-icon" class="event-icon" alt="" />
      <div class="event-card-body">
        <span class="chip chip-warm" data-i18n="event.environmentTag"></span>
        <h3 id="event-name"></h3>
        <p id="event-desc"></p>
      </div>
    </div>

    <div id="event-hint" class="orbit-hint panel hidden"></div>

    <div id="event-orbit-group"></div>

    <p id="event-budget-note" class="budget-note"></p>

    <div class="button-row">
      <button id="event-home-btn" class="btn btn-secondary" data-i18n="event.homeBtn"></button>
      <button id="start-btn" class="btn btn-primary" data-i18n="event.startBtn"></button>
    </div>
  </section>

  <section id="screen-selection" class="screen">
    <ol class="mission-steps" data-current="2">
      <li data-i18n="steps.briefing"></li><li data-i18n="steps.design"></li><li data-i18n="steps.launch"></li><li data-i18n="steps.report"></li>
    </ol>
    <div class="mission-hud"></div>
    <h2 data-i18n="selection.title"></h2>

    <div id="selection-brief" class="selection-brief"></div>

    <div id="selection-hint" class="orbit-hint panel hidden"></div>

    <p id="selection-warning" class="warning hidden"></p>

    <div id="selection-groups"></div>

    <!-- 多人連線：超出預算或質量時的協商面板 -->
    <div id="mp-negotiate" class="mp-negotiate panel panel-gold hidden"></div>

    <!-- 底部固定的操作列：捲到哪裡都按得到發射 -->
    <div class="button-row action-bar">
      <button id="selection-back-btn" class="btn btn-secondary" data-i18n="selection.backBtn"></button>
      <div class="action-info">
        <span id="action-ev" class="action-ev"></span>
        <span class="action-hint" data-i18n="selection.actionHint"></span>
      </div>
      <button id="launch-btn" class="btn btn-primary" disabled data-i18n="selection.launchBtn"></button>
    </div>
  </section>

  <section id="screen-simulation" class="screen">
    <ol class="mission-steps" data-current="3">
      <li data-i18n="steps.briefing"></li><li data-i18n="steps.design"></li><li data-i18n="steps.launch"></li><li data-i18n="steps.report"></li>
    </ol>
    <div class="mission-hud"></div>
    <h2 data-i18n="simulation.title"></h2>

    <div id="flight-track">
      <canvas id="ascent-canvas" class="ascent-canvas"></canvas>
      <div id="ascent-hud" class="ascent-hud"></div>
      <div id="rocket-wrap">
        <div id="rocket"><img id="rocket-img" alt="" /></div>
        <div id="exhaust"></div>
      </div>

      <canvas id="orbit-canvas" class="orbit-canvas"></canvas>
      <button id="uplink-btn" type="button" class="uplink-btn hidden"></button>
      <div id="ops-hud" class="ops-hud">
        <div class="ops-hud-row"><span id="ops-hud-label"></span><span id="ops-hud-value"></span></div>
        <div class="ops-hud-bar"><div id="ops-hud-fill" class="ops-hud-fill"></div><div id="ops-hud-cap" class="ops-hud-cap"></div></div>
        <div id="ops-hud-status" class="ops-hud-status"></div>
        <div id="ops-hud-time" class="ops-hud-time"></div>
      </div>
    </div>
    <!-- 說明文字放在畫面下方，手機上才不會蓋住火箭和地球 -->
    <div id="ascent-caption" class="ascent-caption"></div>
    <div id="orbit-caption" class="orbit-caption"></div>

    <div id="stage-dots" class="stage-dots"></div>
    <div id="roll-meter" class="roll-meter hidden">
      <div class="roll-head"><span id="roll-odds-label"></span><span id="roll-verdict" class="roll-verdict"></span></div>
      <div class="roll-bar"><div id="roll-success" class="roll-success"></div><div id="roll-needle" class="roll-needle"></div></div>
    </div>
    <p id="simulation-log" class="simulation-log"></p>
  </section>

  <section id="screen-results" class="screen">
    <ol class="mission-steps" data-current="4">
      <li data-i18n="steps.briefing"></li><li data-i18n="steps.design"></li><li data-i18n="steps.launch"></li><li data-i18n="steps.report"></li>
    </ol>
    <div class="mission-hud"></div>
    <h2 id="result-title"></h2>
    <p id="result-subtitle" class="result-subtitle"></p>
    <p id="result-reason" class="result-reason hidden"></p>
    <p id="result-campaign-note" class="campaign-note hidden"></p>
    <div id="result-score" class="result-score"></div>
    <h3 class="section-title" data-i18n="waterfall.title"></h3>
    <div id="value-strip" class="value-strip"></div>
    <details id="waterfall-details" class="waterfall-details">
      <summary data-i18n="waterfall.showDetail"></summary>
      <p class="waterfall-hint" data-i18n="waterfall.hint"></p>
      <div class="chart-wrap waterfall-wrap panel">
        <canvas id="waterfall-chart"></canvas>
      </div>
    </details>
    <div id="result-quiz" class="result-quiz"></div>
    <div id="result-report" class="result-report panel"></div>
    <h3 class="section-title" data-i18n="results.achievementsHeader"></h3>
    <ul id="achievements-list" class="badge-list"></ul>
    <div class="button-row">
      <button id="play-again-btn" class="btn btn-primary" data-i18n="results.playAgain"></button>
      <button id="results-home-btn" class="btn btn-secondary" data-i18n="results.backHome"></button>
    </div>
  </section>

  <section id="screen-achievements" class="screen">
    <h2 data-i18n="achievementsGallery.title"></h2>
    <h3 class="section-title"><span data-i18n="achievementsGallery.medalsTitle"></span><span id="medal-count" class="section-count"></span></h3>
    <p class="section-hint" data-i18n="achievementsGallery.medalsHint"></p>
    <div id="medal-gallery" class="medal-gallery"></div>
    <h3 class="section-title"><span data-i18n="achievementsGallery.achievementsTitle"></span><span id="achievement-count" class="section-count"></span></h3>
    <ul id="achievements-gallery-list" class="gallery-list"></ul>
    <button id="achievements-back-btn" class="btn btn-secondary" data-i18n="nav.back"></button>
  </section>

  <section id="screen-mp" class="screen">
    <h2 data-i18n="mp.title"></h2>
    <p id="mp-not-configured" class="warning hidden" data-i18n="mp.notConfigured"></p>

    <div id="mp-entry">
      <p class="section-hint" data-i18n="mp.entryHint"></p>
      <div class="mp-form panel">
        <label class="mp-field"><span data-i18n="mp.nameLabel"></span><input id="mp-name" class="mp-input" maxlength="12" /></label>
        <button id="mp-create-btn" class="btn btn-primary" data-i18n="mp.create"></button>
        <div class="mp-divider" data-i18n="mp.or"></div>
        <label class="mp-field"><span data-i18n="mp.codeLabel"></span><input id="mp-code" class="mp-input mp-code-input" maxlength="4" autocomplete="off" /></label>
        <button id="mp-join-btn" class="btn btn-secondary" data-i18n="mp.join"></button>
        <p id="mp-error" class="mp-error"></p>
      </div>
      <button id="mp-entry-back-btn" class="btn btn-secondary" data-i18n="nav.back"></button>
    </div>

    <div id="mp-lobby" class="hidden">
      <div class="mp-code-box panel">
        <span data-i18n="mp.roomCode"></span>
        <strong id="mp-room-code"></strong>
        <span class="section-hint" data-i18n="mp.shareHint"></span>
      </div>
      <h3 class="section-title"><span data-i18n="mp.players"></span><span id="mp-player-count" class="section-count"></span></h3>
      <ul id="mp-players" class="mp-players"></ul>
      <h3 class="section-title" data-i18n="mp.roles"></h3>
      <p class="section-hint" data-i18n="mp.rolesHint"></p>
      <div id="mp-roles" class="cards mp-roles"></div>
      <h3 class="section-title" data-i18n="mp.missionSetup"></h3>
      <div class="mp-setup">
        <label class="mp-field"><span data-i18n="mp.objective"></span><select id="mp-objective" class="mp-input"></select></label>
        <label class="mp-field"><span data-i18n="mp.event"></span><select id="mp-event" class="mp-input"></select></label>
      </div>
      <p id="mp-lobby-status" class="mp-lobby-status"></p>
      <div class="button-row">
        <button id="mp-leave-btn" class="btn btn-secondary" data-i18n="mp.leave"></button>
        <button id="mp-start-btn" class="btn btn-primary" data-i18n="mp.start"></button>
      </div>
    </div>
  </section>

  <section id="screen-codex" class="screen">
    <h2 data-i18n="codex.title"></h2>
    <p class="section-hint" data-i18n="codex.hint"></p>
    <div id="codex-tabs" class="codex-tabs"></div>
    <div id="codex-entries" class="codex-entries"></div>
    <button id="codex-back-btn" class="btn btn-secondary"></button>
  </section>

  <section id="screen-settings" class="screen">
    <h2 data-i18n="settings.title"></h2>

    <div class="settings-panel panel">
      <div class="settings-row">
        <span data-i18n="settings.sound"></span>
        <label class="switch">
          <input type="checkbox" id="settings-sound-toggle" />
          <span class="switch-slider"></span>
        </label>
      </div>

      <div class="settings-row">
        <span data-i18n="settings.volume"></span>
        <input type="range" id="settings-volume-slider" class="pixel-range" min="0" max="1" step="0.05" />
      </div>
    </div>

    <button id="settings-reset-btn" class="btn btn-danger" data-i18n="settings.resetProgress"></button>
    <button id="settings-back-btn" class="btn btn-secondary" data-i18n="nav.back"></button>
  </section>

  <div id="anomaly-overlay" class="tutorial-overlay hidden">
    <div class="anomaly-card panel panel-alert">
      <div class="anomaly-header"><img class="anomaly-badge" src="image/icons/alert.png" alt="" /><h3 id="anomaly-title"></h3></div>
      <p id="anomaly-desc" class="anomaly-desc"></p>
      <p id="anomaly-meta" class="anomaly-meta"></p>
      <div id="anomaly-options" class="anomaly-options"></div>
      <p id="anomaly-hint" class="anomaly-hint"></p>
    </div>
  </div>

  <!-- 多人連線：底部隊伍列與提示訊息 -->
  <div id="mp-bar" class="mp-bar hidden"></div>
  <div id="mp-toast" class="mp-toast hidden"></div>
  <div id="mp-chat" class="mp-chat panel hidden">
    <div class="mp-chat-head"><span data-i18n="mp.chat"></span><button type="button" id="mp-chat-close" class="blueprint-detail-close" aria-label="close">×</button></div>
    <div id="mp-chat-log" class="mp-chat-log"></div>
    <div id="mp-chat-quick" class="mp-chat-quick"></div>
    <div class="mp-chat-input-row">
      <input id="mp-chat-input" class="mp-input" maxlength="120" autocomplete="off" />
      <button type="button" id="mp-chat-send" class="btn btn-secondary" data-i18n="mp.send"></button>
    </div>
  </div>

  <div id="tutorial-overlay" class="tutorial-overlay hidden">
    <div class="tutorial-card panel">
      <img class="tutorial-avatar" src="image/icons/mascot-orbit.png" alt="" />
      <div class="tutorial-body">
        <div id="tutorial-name" class="tutorial-name"></div>
        <p id="tutorial-text" class="tutorial-text"></p>
        <div class="tutorial-actions">
          <button id="tutorial-skip-btn" type="button" class="btn-link"></button>
          <button id="tutorial-next-btn" type="button" class="btn btn-primary btn-small"></button>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/storage.js?v=99"></script>
<script src="js/i18n.js?v=99"></script>
<script src="js/sound.js?v=99"></script>
<script src="js/fx.js?v=99"></script>
<script src="js/data.js?v=99"></script>
<script src="js/state.js?v=99"></script>
<script src="js/mission.js?v=99"></script>
<script src="js/operations.js?v=99"></script>
<script src="js/scoring.js?v=99"></script>
<script src="js/bestdesigns.js?v=99"></script>
<script src="js/earthmap.js?v=99"></script>
<script src="js/orbitview.js?v=99"></script>
<script src="js/ascentview.js?v=99"></script>
<script src="js/selection.js?v=99"></script>
<script src="js/simulation.js?v=99"></script>
<script src="js/results.js?v=99"></script>
<script src="js/learning.js?v=99"></script>
<script src="js/achievements.js?v=99"></script>
<script src="js/settings.js?v=99"></script>
<script src="js/codex.js?v=99"></script>
<script src="js/netconfig.js?v=99"></script>
<script src="js/net.js?v=99"></script>
<script src="js/multiplayer.js?v=99"></script>
<script src="js/tutorial.js?v=99"></script>
<script src="js/main.js?v=99"></script>
</body>
</html>
