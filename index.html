<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>太空精算師 · Space Actuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=25" />
</head>
<body>
<main id="app">

  <section id="screen-home" class="screen active">
    <h1 id="app-title" class="game-title" data-i18n="app.title"></h1>
    <p class="home-subtitle" data-i18n="home.subtitle"></p>
    <button id="home-campaign-btn" class="btn btn-primary"></button>
    <button id="home-start-btn" class="btn btn-secondary"></button>
    <button id="home-achievements-btn" class="btn btn-secondary" data-i18n="home.achievements"></button>
    <button id="home-settings-btn" class="btn btn-secondary" data-i18n="home.settings"></button>
  </section>

  <section id="screen-event" class="screen">
    <h2 data-i18n="event.title"></h2>

    <div id="objective-card" class="event-card hidden">
      <div id="objective-icon" class="event-icon"></div>
      <h2 id="objective-name"></h2>
      <p id="objective-desc"></p>
      <p id="objective-req" class="objective-req"></p>
    </div>

    <div id="event-reveal-card" class="event-card hidden">
      <div id="event-icon" class="event-icon"></div>
      <h2 id="event-name"></h2>
      <p id="event-desc"></p>
    </div>

    <div id="event-orbit-group"></div>

    <p id="event-budget-note" class="budget-note"></p>

    <button id="start-btn" class="btn btn-primary" data-i18n="event.startBtn"></button>
  </section>

  <section id="screen-selection" class="screen">
    <h2 data-i18n="selection.title"></h2>

    <p id="selection-warning" class="warning hidden"></p>

    <div id="selection-groups"></div>

    <button id="launch-btn" class="btn btn-primary" disabled data-i18n="selection.launchBtn"></button>
  </section>

  <section id="screen-simulation" class="screen">
    <h2 data-i18n="simulation.title"></h2>

    <div id="flight-track">
      <div id="flight-scene">
        <div class="star-field"></div>

        <img class="planet planet-mercury" src="image/Stars/mercury.png" style="top:60px;left:18%" alt="Mercury" title="Mercury" />
        <img class="planet planet-venus" src="image/Stars/venus.png" style="top:140px;left:68%" alt="Venus" title="Venus" />
        <img class="planet planet-mars" src="image/Stars/mars.png" style="top:290px;left:82%" alt="Mars" title="Mars" />
        <img class="planet planet-jupiter" src="image/Stars/jupiter.png" style="top:360px;left:22%" alt="Jupiter" title="Jupiter" />
        <img class="planet planet-saturn" src="image/Stars/Saturn.png" style="top:460px;left:64%" alt="Saturn" title="Saturn" />
        <img class="planet planet-uranus" src="image/Stars/uranus.png" style="top:550px;left:14%" alt="Uranus" title="Uranus" />
        <img class="planet planet-neptune" src="image/Stars/neptune.png" style="top:630px;left:76%" alt="Neptune" title="Neptune" />
        <img class="planet planet-pluto" src="image/Stars/pluto.png" style="top:700px;left:46%" alt="Pluto" title="Pluto" />

        <div class="cloud" style="top:1240px;left:8%"></div>
        <div class="cloud" style="top:1290px;left:52%"></div>
        <div class="cloud" style="top:1355px;left:28%"></div>
        <div class="cloud" style="top:1400px;left:72%"></div>

        <span class="zone-label" style="top:1740px;" data-i18n="simulation.zoneGround"></span>
        <span class="zone-label" style="top:900px;" data-i18n="simulation.zoneAtmosphere"></span>
        <span class="zone-label" style="top:90px;" data-i18n="simulation.zoneOrbit"></span>
      </div>

      <div id="rocket-wrap">
        <div id="rocket"><img id="rocket-img" alt="" /></div>
        <div id="exhaust"></div>
      </div>

      <canvas id="orbit-canvas" class="orbit-canvas"></canvas>
      <div id="ops-hud" class="ops-hud">
        <div class="ops-hud-row"><span id="ops-hud-label"></span><span id="ops-hud-value"></span></div>
        <div class="ops-hud-bar"><div id="ops-hud-fill" class="ops-hud-fill"></div><div id="ops-hud-cap" class="ops-hud-cap"></div></div>
        <div id="ops-hud-status" class="ops-hud-status"></div>
      </div>
      <div id="orbit-caption" class="orbit-caption"></div>
    </div>

    <div id="stage-dots" class="stage-dots"></div>
    <div id="roll-meter" class="roll-meter hidden">
      <div class="roll-head"><span id="roll-odds-label"></span><span id="roll-verdict" class="roll-verdict"></span></div>
      <div class="roll-bar"><div id="roll-success" class="roll-success"></div><div id="roll-needle" class="roll-needle"></div></div>
    </div>
    <p id="simulation-log" class="simulation-log"></p>
  </section>

  <section id="screen-results" class="screen">
    <h2 id="result-title"></h2>
    <p id="result-subtitle"></p>
    <p id="result-reason" class="result-reason hidden"></p>
    <p id="result-campaign-note" class="campaign-note hidden"></p>
    <div id="result-score" class="result-score"></div>
    <div id="result-report" class="result-report"></div>
    <h3 data-i18n="waterfall.title"></h3>
    <p class="waterfall-hint" data-i18n="waterfall.hint"></p>
    <div class="chart-wrap waterfall-wrap">
      <canvas id="waterfall-chart"></canvas>
    </div>
    <h3 data-i18n="results.achievementsHeader"></h3>
    <ul id="achievements-list"></ul>
    <button id="play-again-btn" class="btn btn-primary" data-i18n="results.playAgain"></button>
    <button id="results-home-btn" class="btn btn-secondary" data-i18n="results.backHome"></button>
  </section>

  <section id="screen-achievements" class="screen">
    <h2 data-i18n="achievementsGallery.title"></h2>
    <ul id="achievements-gallery-list" class="gallery-list"></ul>
    <button id="achievements-back-btn" class="btn btn-secondary" data-i18n="nav.back"></button>
  </section>

  <section id="screen-settings" class="screen">
    <h2 data-i18n="settings.title"></h2>

    <div class="settings-row">
      <span data-i18n="settings.language"></span>
      <div class="lang-buttons">
        <button type="button" class="btn btn-secondary lang-btn" data-lang="zh">中文</button>
        <button type="button" class="btn btn-secondary lang-btn" data-lang="en">English</button>
      </div>
    </div>

    <div class="settings-row">
      <span data-i18n="settings.sound"></span>
      <label class="switch">
        <input type="checkbox" id="settings-sound-toggle" />
        <span class="switch-slider"></span>
      </label>
    </div>

    <div class="settings-row">
      <span data-i18n="settings.volume"></span>
      <input type="range" id="settings-volume-slider" min="0" max="1" step="0.05" />
    </div>

    <button id="settings-reset-btn" class="btn btn-secondary" data-i18n="settings.resetProgress"></button>
    <button id="settings-back-btn" class="btn btn-secondary" data-i18n="nav.back"></button>
  </section>

  <div id="anomaly-overlay" class="tutorial-overlay hidden">
    <div class="anomaly-card">
      <div class="anomaly-header"><span class="anomaly-badge">🚨</span><h3 id="anomaly-title"></h3></div>
      <p id="anomaly-desc" class="anomaly-desc"></p>
      <p id="anomaly-meta" class="anomaly-meta"></p>
      <div id="anomaly-options" class="anomaly-options"></div>
      <p id="anomaly-hint" class="anomaly-hint"></p>
    </div>
  </div>

  <div id="tutorial-overlay" class="tutorial-overlay hidden">
    <div class="tutorial-card">
      <div class="tutorial-avatar">🤖</div>
      <div class="tutorial-body">
        <div id="tutorial-name" class="tutorial-name"></div>
        <p id="tutorial-text" class="tutorial-text"></p>
        <div class="tutorial-actions">
          <button id="tutorial-skip-btn" type="button" class="btn-link"></button>
          <button id="tutorial-next-btn" type="button" class="btn btn-primary"></button>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/storage.js?v=25"></script>
<script src="js/i18n.js?v=25"></script>
<script src="js/sound.js?v=25"></script>
<script src="js/data.js?v=25"></script>
<script src="js/state.js?v=25"></script>
<script src="js/mission.js?v=25"></script>
<script src="js/operations.js?v=25"></script>
<script src="js/scoring.js?v=25"></script>
<script src="js/bestdesigns.js?v=25"></script>
<script src="js/orbitview.js?v=25"></script>
<script src="js/selection.js?v=25"></script>
<script src="js/simulation.js?v=25"></script>
<script src="js/results.js?v=25"></script>
<script src="js/achievements.js?v=25"></script>
<script src="js/settings.js?v=25"></script>
<script src="js/tutorial.js?v=25"></script>
<script src="js/main.js?v=25"></script>
</body>
</html>
